<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="sliderFiles/style.css">
    <title>Document</title>
</head>
<body>
    <div class="slider-container" id="slider-container">

        <div class="img-container" id="img-container">
            <img src="img/loading.gif" alt="" id="slider-img" class="slider-img">
        </div>

        <button id="right-slider-btn" class="slider-btn slider-btn-right">
            <i class="fa-solid fa-chevron-right"></i>
        </button>

        <button id="left-slider-btn" class="slider-btn slider-btn-left">
            <i class="fa-solid fa-chevron-left"></i>
        </button>

        <div id="dot-container" class="dot-container"></div>

    </div>
</body>

</html>
